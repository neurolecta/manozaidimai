<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skaitymo Treniruotė - Disleksijos Centras</title>
    <link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;500&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient-1: #E8F4FD;
            --bg-gradient-2: #FDF2E9;
            --card-bg: #ffffff;
            --primary: #5B9BD5;
            --primary-dark: #4A89C4;
            --success: #7CB87C;
            --success-dark: #5A9A5A;
            --warning: #E8A87C;
            --danger: #D88888;
            --text-main: #3D4852;
            --text-light: #8795A1;
            --book-font: 'Literata', 'Georgia', 'Times New Roman', serif;
            --ui-font: 'Nunito', 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: var(--ui-font); 
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            color: var(--text-main);
            padding: 20px;
        }

        /* ===== MENIU ===== */
        #menu { 
            text-align: center; 
            background: var(--card-bg); 
            padding: 40px 50px; 
            border-radius: 30px; 
            box-shadow: 0 20px 60px rgba(91, 155, 213, 0.15); 
            max-width: 480px;
            width: 100%;
        }

        .logo { font-size: 3.5rem; margin-bottom: 10px; }
        h1 { color: var(--primary); margin: 0 0 10px 0; font-weight: 700; font-size: 1.8rem; }
        .subtitle { color: var(--text-light); margin-bottom: 30px; font-size: 1rem; }

        .level-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        
        .level-btn { 
            padding: 18px 25px; 
            font-size: 1rem; 
            font-weight: 700;
            font-family: var(--ui-font);
            cursor: pointer; 
            border: none; 
            border-radius: 16px; 
            background: linear-gradient(135deg, #F8FAFC 0%, #EDF2F7 100%);
            color: var(--text-main); 
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        .level-btn:hover { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white; 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(91, 155, 213, 0.3);
        }

        .level-btn .level-icon {
            font-size: 1.5rem;
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .level-btn:hover .level-icon { background: rgba(255,255,255,0.2); box-shadow: none; }
        .level-btn .level-text { flex: 1; }
        .level-btn .level-name { font-size: 1.1rem; display: block; }
        .level-btn .level-desc { font-size: 0.85rem; opacity: 0.7; font-weight: 600; }

        /* ===== ŽAIDIMO LANGAS ===== */
        #game { display: none; width: 100%; max-width: 800px; text-align: center; }
        
        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .timer-display { 
            font-size: 2rem; 
            font-weight: 700; 
            color: var(--primary); 
            background: white;
            padding: 12px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-display .timer-icon { font-size: 1.5rem; }

        .control-buttons { display: flex; gap: 10px; }

        .ctrl-btn { 
            background: white; 
            color: var(--text-main); 
            border: none; 
            padding: 12px 20px; 
            border-radius: 14px; 
            cursor: pointer; 
            font-weight: 700;
            font-family: var(--ui-font);
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .ctrl-btn.active { background: var(--primary); color: white; }
        .ctrl-btn.stop-btn { background: var(--danger); color: white; }
        .ctrl-btn.pause-btn.paused { background: var(--warning); color: white; }

        /* STATISTIKOS JUOSTA */
        .stats-bar { 
            display: flex; 
            justify-content: center;
            gap: 30px;
            margin-bottom: 25px; 
            flex-wrap: wrap;
        }

        .stat-item {
            background: white;
            padding: 12px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-icon { font-size: 1.3rem; }
        .stat-value { font-size: 1.4rem; font-weight: 700; }
        .stat-value.correct { color: var(--success); }
        .stat-value.incorrect { color: var(--danger); }
        .stat-value.tempo { color: var(--primary); }
        .stat-label { font-size: 0.85rem; color: var(--text-light); }

        /* ŽODŽIO KORTELĖ */
        #word-container { 
            background: white; 
            padding: 80px 40px 60px; 
            border-radius: 30px; 
            position: relative; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        /* PAUZĖS OVERLAY */
        .pause-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10;
        }

        .pause-overlay.visible { display: flex; }
        .pause-overlay .pause-icon { font-size: 4rem; margin-bottom: 15px; }
        .pause-overlay .pause-text { font-size: 1.5rem; color: var(--text-light); font-weight: 700; }
        .pause-overlay .pause-word {
            font-family: var(--book-font);
            font-size: 2.5rem;
            color: var(--text-main);
            margin-top: 20px;
            padding: 15px 30px;
            background: #F8FAFC;
            border-radius: 15px;
        }

        /* SKAITYMO ŠRIFTAS */
        #word-display { 
            font-family: var(--book-font);
            font-size: 4.5rem; 
            font-weight: 400;
            min-height: 120px; 
            color: #1A202C;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            word-break: break-word;
        }

        /* LAIKO JUOSTA - labai subtili */
        #timer-track { 
            width: 100%; 
            height: 3px; 
            background: #F1F5F9; 
            border-radius: 2px; 
            overflow: hidden;
            opacity: 0.4;
        }
        #timer-bar { 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(90deg, var(--primary) 0%, #93C5FD 100%);
            transition: width linear; 
            border-radius: 2px;
        }

        /* VEIKSMO MYGTUKAI */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        .action-btn { 
            background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
            color: white; 
            border: none; 
            flex: 1;
            max-width: 350px;
            padding: 22px 30px; 
            font-size: 1.4rem; 
            border-radius: 20px; 
            cursor: pointer;
            font-weight: 700;
            font-family: var(--ui-font);
            box-shadow: 0 8px 0 var(--success-dark), 0 12px 30px rgba(124, 184, 124, 0.3);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .action-btn:active { 
            transform: translateY(4px); 
            box-shadow: 0 4px 0 var(--success-dark), 0 8px 20px rgba(124, 184, 124, 0.3);
        }

        .skip-btn {
            background: linear-gradient(135deg, #CBD5E1 0%, #94A3B8 100%);
            box-shadow: 0 8px 0 #64748B, 0 12px 30px rgba(100, 116, 139, 0.2);
            max-width: 180px;
        }

        .skip-btn:active { box-shadow: 0 4px 0 #64748B, 0 8px 20px rgba(100, 116, 139, 0.2); }

        .keyboard-hint {
            margin-top: 20px;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .key {
            display: inline-block;
            background: #F1F5F9;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            margin: 0 3px;
        }

        /* REZULTATŲ LANGAS */
        #results {
            display: none;
            text-align: center;
            background: var(--card-bg);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(91, 155, 213, 0.15);
            max-width: 500px;
            width: 100%;
        }

        .results-icon { font-size: 5rem; margin-bottom: 20px; }
        .results-title { font-size: 2rem; font-weight: 700; color: var(--primary); margin-bottom: 30px; }

        .results-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .result-box { background: #F8FAFC; padding: 20px; border-radius: 15px; }
        .result-box .value { font-size: 2.5rem; font-weight: 700; }
        .result-box .label { color: var(--text-light); font-size: 0.95rem; }
        .result-box.correct .value { color: var(--success); }
        .result-box.incorrect .value { color: var(--danger); }

        .results-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2rem;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 700;
            font-family: var(--ui-font);
            transition: all 0.2s ease;
        }

        .results-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(91, 155, 213, 0.3);
        }

        @media (max-width: 600px) {
            #word-display { font-size: 3rem; }
            .top-bar { justify-content: center; }
            .stats-bar { gap: 15px; }
            .stat-item { padding: 10px 15px; }
            .action-buttons { flex-direction: column; }
            .skip-btn { max-width: none; }
        }
    </style>
</head>
<body>

<!-- PAGRINDINIS MENIU -->
<div id="menu">
    <div class="logo">📖</div>
    <h1>Skaitymo Treniruotė</h1>
    <p class="subtitle">Pasirink sunkumo lygį ir pradėk!</p>
    
    <div class="level-grid">
        <button class="level-btn" onclick="startGame(0)">
            <span class="level-icon">🌱</span>
            <span class="level-text">
                <span class="level-name">0 Lygis</span>
                <span class="level-desc">4 raidės • Labai lengva</span>
            </span>
        </button>
        <button class="level-btn" onclick="startGame(1)">
            <span class="level-icon">⭐</span>
            <span class="level-text">
                <span class="level-name">1 Lygis</span>
                <span class="level-desc">6 raidės • Lengva</span>
            </span>
        </button>
        <button class="level-btn" onclick="startGame(2)">
            <span class="level-icon">🌟</span>
            <span class="level-text">
                <span class="level-name">2 Lygis</span>
                <span class="level-desc">8 raidės • Vidutiniškai</span>
            </span>
        </button>
        <button class="level-btn" onclick="startGame(3)">
            <span class="level-icon">💪</span>
            <span class="level-text">
                <span class="level-name">3 Lygis</span>
                <span class="level-desc">10 raidžių • Sunku</span>
            </span>
        </button>
        <button class="level-btn" onclick="startGame(4)">
            <span class="level-icon">🚀</span>
            <span class="level-text">
                <span class="level-name">4 Lygis</span>
                <span class="level-desc">16 raidžių sakiniai • Labai sunku</span>
            </span>
        </button>
    </div>
</div>

<!-- ŽAIDIMO LANGAS -->
<div id="game">
    <div class="top-bar">
        <div class="timer-display">
            <span class="timer-icon">⏱️</span>
            <span id="main-timer">05:00</span>
        </div>
        
        <div class="control-buttons">
            <button class="ctrl-btn pause-btn" onclick="togglePause()" id="pauseBtn">
                <span id="pauseIcon">⏸️</span>
                <span id="pauseText">Pauzė</span>
            </button>
            <button class="ctrl-btn" onclick="toggleMetronome()" id="metronomeBtn">
                <span>🎵</span>
                <span id="metronomeText">Metronomas</span>
            </button>
            <button class="ctrl-btn stop-btn" onclick="stopGame()">
                <span>⏹️</span>
                <span>Baigti</span>
            </button>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-icon">✅</span>
            <div>
                <div class="stat-value correct" id="count-correct">0</div>
                <div class="stat-label">Teisingai</div>
            </div>
        </div>
        <div class="stat-item">
            <span class="stat-icon">❌</span>
            <div>
                <div class="stat-value incorrect" id="count-incorrect">0</div>
                <div class="stat-label">Praleista</div>
            </div>
        </div>
        <div class="stat-item">
            <span class="stat-icon">💨</span>
            <div>
                <div class="stat-value tempo" id="bpm-display">60</div>
                <div class="stat-label">Tempas</div>
            </div>
        </div>
    </div>

    <div id="word-container">
        <div class="pause-overlay" id="pauseOverlay">
            <div class="pause-icon">⏸️</div>
            <div class="pause-text">Pauzė</div>
            <div class="pause-word" id="pauseWord"></div>
        </div>
        <div id="word-display">...</div>
        <div id="timer-track">
            <div id="timer-bar"></div>
        </div>
    </div>

    <div class="action-buttons">
        <button class="action-btn" onclick="handleRead()">
            <span>✓</span>
            <span>PERSKAIČIAU</span>
        </button>
        <button class="action-btn skip-btn" onclick="handleSkip()">
            <span>→</span>
            <span>PRALEISTI</span>
        </button>
    </div>

    <div class="keyboard-hint">
        <span class="key">Tarpas</span> = Perskaičiau &nbsp;|&nbsp; 
        <span class="key">→</span> = Praleisti &nbsp;|&nbsp;
        <span class="key">P</span> = Pauzė
    </div>
</div>

<!-- REZULTATŲ LANGAS -->
<div id="results">
    <div class="results-icon">🎉</div>
    <div class="results-title">Puikiai padirbėta!</div>
    
    <div class="results-stats">
        <div class="result-box correct">
            <div class="value" id="final-correct">0</div>
            <div class="label">Perskaičiau</div>
        </div>
        <div class="result-box incorrect">
            <div class="value" id="final-incorrect">0</div>
            <div class="label">Praleista</div>
        </div>
    </div>
    
    <button class="results-btn" onclick="backToMenu()">Grįžti į meniu</button>
</div>

        { words: ["Sukėja", "tyla", "kylėja"], total: 16 },
        { words: ["Pakala", "dega", "lipėja"], total: 16 },
        { words: ["Numila", "gula", "rėdėja"], total: 16 },
        // 8 + 8 = 16 raidžių
        { words: ["Pakalėja", "numilėja"], total: 16 },
        { words: ["Patekėja", "sugulėja"], total: 16 },
        { words: ["Iškalėja", "nukylėja"], total: 16 },
        { words: ["Užmilėja", "atlipėja"], total: 16 },
        { words: ["Pakylėja", "surėdėja"], total: 16 },
        // 6 + 10 = 16 raidžių
        { words: ["Kalėja", "pasakojima"], total: 16 },
        { words: ["Tekėja", "iškelėjima"], total: 16 },
        { words: ["Gulėja", "numylėjima"], total: 16 },
        { words: ["Kylėja", "patikėjima"], total: 16 },
        { words: ["Lipėja", "nusukiojam"], total: 16 }
    ];

    // ===== ŽAIDIMO KINTAMIEJI =====
    let bpm = 60;
    let currentLevel = 1;
    let correctCount = 0;
    let incorrectCount = 0;
    let timeLeft = 300;
    let gameActive = false;
    let isPaused = false;
    let metronomeEnabled = false;
    let metronomeTimeout = null;
    let countdownInterval = null;
    let currentWordStartTime = 0;
    let wordTimeout = null;
    let currentWord = "";
    let usedWords = new Set();
    
    let audioCtx = null;

    // ===== ŽODŽIŲ GENERAVIMAS =====
    
    function getRandomWord(wordList) {
        // Jei visi žodžiai panaudoti, išvalyti ir pradėti iš naujo
        const availableWords = wordList.filter(w => !usedWords.has(w));
        if (availableWords.length === 0) {
            usedWords.clear();
            return wordList[Math.floor(Math.random() * wordList.length)];
        }
        const word = availableWords[Math.floor(Math.random() * availableWords.length)];
        usedWords.add(word);
        return word;
    }

    function capitalize(word) {
        return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    }

    function generatePseudoWord(level) {
        if (level === 0) {
            return capitalize(getRandomWord(words4));
        }
        
        if (level === 1) {
            return capitalize(getRandomWord(words6));
        }
        
        if (level === 2) {
            return capitalize(getRandomWord(words8));
        }
        
        if (level === 3) {
            return capitalize(getRandomWord(words10));
        }
        
        if (level === 4) {
            const sentence = sentences16[Math.floor(Math.random() * sentences16.length)];
            return sentence.words.join(" ") + ".";
        }
        
        return "Žodis";
    }

    // ===== METRONOMAS =====
    
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playTick() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const envelope = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        envelope.gain.setValueAtTime(0.03, audioCtx.currentTime);
        envelope.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(envelope);
        envelope.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function runMetronome() {
        if (!gameActive || !metronomeEnabled || isPaused) return;
        playTick();
        metronomeTimeout = setTimeout(runMetronome, (60 / bpm) * 1000);
    }

    function toggleMetronome() {
        initAudio();
        metronomeEnabled = !metronomeEnabled;
        const btn = document.getElementById('metronomeBtn');
        const text = document.getElementById('metronomeText');
        
        if (metronomeEnabled) {
            btn.classList.add('active');
            text.textContent = 'Metronomas ✓';
            if (gameActive && !isPaused) runMetronome();
        } else {
            btn.classList.remove('active');
            text.textContent = 'Metronomas';
            clearTimeout(metronomeTimeout);
        }
    }

    // ===== ŽAIDIMO VALDYMAS =====

    function startGame(level) {
        initAudio();
        currentLevel = level;
        // Pradinis tempas priklauso nuo lygio
        bpm = level === 0 ? 40 : (level === 1 ? 50 : (level === 2 ? 55 : (level === 3 ? 50 : 45)));
        correctCount = 0;
        incorrectCount = 0;
        timeLeft = 300;
        isPaused = false;
        usedWords.clear();
        
        document.getElementById('menu').style.display = 'none';
        document.getElementById('results').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        
        updateStats();
        gameActive = true;
        nextWord();
        if (metronomeEnabled) runMetronome();
        startGlobalTimer();
    }

    function stopGame() {
        gameActive = false;
        isPaused = false;
        clearTimeout(metronomeTimeout);
        clearTimeout(wordTimeout);
        clearInterval(countdownInterval);
        
        document.getElementById('game').style.display = 'none';
        document.getElementById('final-correct').textContent = correctCount;
        document.getElementById('final-incorrect').textContent = incorrectCount;
        document.getElementById('results').style.display = 'block';
    }

    function backToMenu() {
        document.getElementById('results').style.display = 'none';
        document.getElementById('menu').style.display = 'block';
    }

    function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById('pauseBtn');
        const icon = document.getElementById('pauseIcon');
        const text = document.getElementById('pauseText');
        const overlay = document.getElementById('pauseOverlay');
        const pauseWord = document.getElementById('pauseWord');
        
        if (isPaused) {
            btn.classList.add('paused');
            icon.textContent = '▶️';
            text.textContent = 'Tęsti';
            overlay.classList.add('visible');
            pauseWord.textContent = currentWord;
            clearTimeout(wordTimeout);
            clearTimeout(metronomeTimeout);
            
            const bar = document.getElementById('timer-bar');
            const computedStyle = window.getComputedStyle(bar);
            bar.style.width = computedStyle.width;
            bar.style.transition = 'none';
        } else {
            btn.classList.remove('paused');
            icon.textContent = '⏸️';
            text.textContent = 'Pauzė';
            overlay.classList.remove('visible');
            
            resumeWord();
            if (metronomeEnabled) runMetronome();
        }
    }

    function resumeWord() {
        const bar = document.getElementById('timer-bar');
        const currentWidth = parseFloat(bar.style.width) || 100;
        const remainingPercent = currentWidth / 100;
        const timeForWord = (60 / bpm) * 4 * 1000;
        const remainingTime = timeForWord * remainingPercent;
        
        bar.style.transition = `width ${remainingTime}ms linear`;
        bar.style.width = '0%';
        
        wordTimeout = setTimeout(() => {
            if (gameActive && !isPaused) {
                incorrectCount++;
                bpm = Math.max(30, bpm - 2);
                updateStats();
                nextWord();
            }
        }, remainingTime);
    }

    function startGlobalTimer() {
        countdownInterval = setInterval(() => {
            if (!gameActive || isPaused) return;
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('main-timer').textContent = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            if (timeLeft <= 0) {
                stopGame();
            }
        }, 1000);
    }

    function nextWord() {
        if (!gameActive || isPaused) return;
        
        currentWord = generatePseudoWord(currentLevel);
        document.getElementById('word-display').textContent = currentWord;
        
        const bar = document.getElementById('timer-bar');
        bar.style.transition = 'none';
        bar.style.width = '100%';
        void bar.offsetWidth;

        const timeForWord = (60 / bpm) * 4 * 1000;
        bar.style.transition = `width ${timeForWord}ms linear`;
        bar.style.width = '0%';

        currentWordStartTime = Date.now();

        clearTimeout(wordTimeout);
        wordTimeout = setTimeout(() => {
            if (gameActive && !isPaused) {
                incorrectCount++;
                bpm = Math.max(30, bpm - 2);
                updateStats();
                nextWord();
            }
        }, timeForWord);
    }

    function handleRead() {
        if (!gameActive || isPaused) return;
        clearTimeout(wordTimeout);
        
        const timeTaken = Date.now() - currentWordStartTime;
        const allocatedTime = (60 / bpm) * 4 * 1000;

        if (timeTaken < allocatedTime * 0.6) {
            bpm = Math.min(150, bpm + 3);
        } else if (timeTaken < allocatedTime * 0.8) {
            bpm = Math.min(150, bpm + 1);
        }

        correctCount++;
        updateStats();
        nextWord();
    }

    function handleSkip() {
        if (!gameActive || isPaused) return;
        clearTimeout(wordTimeout);
        
        incorrectCount++;
        bpm = Math.max(30, bpm - 1);
        
        updateStats();
        nextWord();
    }

    function updateStats() {
        document.getElementById('count-correct').textContent = correctCount;
        document.getElementById('count-incorrect').textContent = incorrectCount;
        document.getElementById('bpm-display').textContent = Math.round(bpm);
    }

    // ===== KLAVIATŪROS VALDYMAS =====
    
    window.addEventListener('keydown', (e) => {
        if (e.code === "Space") {
            e.preventDefault();
            if (gameActive && !isPaused) handleRead();
        } else if (e.code === "ArrowRight") {
            e.preventDefault();
            if (gameActive && !isPaused) handleSkip();
        } else if (e.code === "KeyP") {
            e.preventDefault();
            if (gameActive) togglePause();
        } else if (e.code === "Escape") {
            e.preventDefault();
            if (gameActive) stopGame();
        }
    });
</script>

</body>
